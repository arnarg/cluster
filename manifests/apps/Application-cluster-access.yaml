apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-access
  namespace: argocd
spec:
  destination:
    namespace: cluster-access
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/cluster-access
    repoURL: https://github.com/arnarg/cluster.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
