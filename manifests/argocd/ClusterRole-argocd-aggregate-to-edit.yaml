apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/part-of: argocd
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: argocd-aggregate-to-edit
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch
